# sAMPLE CONFIGURATION
# kate: syntax yaml;
# vi: ft=yaml :

# List of plugin names to load on startup
# Plugins that implement only one effect are normally auto-loaded and do not need
# to be specified here. This is useful mostly for loading multi-effect plugins.
plugins: [lua]
# Additional paths to search plugins in. Similar to -m option on command line.
# plugin-paths: []

# List of device names, used for filtering profiles
# Serial can be found by plugin in the device while the service is
# running. Service will output the serial on its debug output.
# devices:
#     foo: 000123456789

# Generic key groups, available to all profiles
# Recognized key names can come either from a layout file or from
# libkeyleds dictionnary, in libkeyelds/src/strings.c section keycode_names
groups:
    special: [game, light]
    functions: [F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12]
    functions-extra: [sysrq, scrolllock, pause]
    ALPHA: [a, b, c, d, e, f, g, h, i, j, k, l, m,
            n, o, p, q, r, s, t, u, v, w, x, y, z]
    NUMBERS: ["1", "2","3","4","5","6","7","8","9","0"]
    modifiers: [lctrl, rctrl, lshift, rshift, lmeta, rmeta, lalt, ralt, capslock, fn, compose]
    arrows: [left, right, up, down]
    numpad: [NUMLOCK, KPSLASH, KPASTERISK,  KPMINUS, KPPLUS, KPENTER, KP1, KP2, KP3, KP4, KP5, KP6, KP7, KP8, KP9, KP0, KPDOT ]
    media: [PLAY, STOP, previoussong, nextsong, PREV, NEXT, MUTE,game, light]
    border: [sysrq, scrolllock, pause, PLAY, STOP, previoussong, nextsong, PREV, NEXT, MUTE,game, light,
    #F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12,
             insert, delete, home, end, pageup, pagedown, left,right, up, down,
             #lctrl, rctrl, lshift, rshift, lmeta, rmeta, lalt, ralt, capslock, fn, compose,
             NUMLOCK, KPSLASH, KPASTERISK,  KPMINUS, KPPLUS, KPENTER, KP1, KP2, KP3, KP4, KP5, KP6, KP7, KP8, KP9, KP0, KPDOT]
    punctuation: [grave, minus, equal, lbrace, rbrace, backslash, semicolon, apostrophe, comma, dot, slash]

# Effects define a named set of plugins for use in profiles.
# Effects are rendered in order, so effects down the list can see and/or
# overwrite whatever was rendered by effects higher in the list.
#
# Anytime a color is specified, it can be either:
#   - a 6-digit RGB hexadecimal color, web-style. Eg: ffff00 is yellow.
#   - an 8-digit RGBA hexadecimal color. Last two digits specify transparency,
#     from 00 (transparent) to ff (opaque).
#   - a color name, from CSS web color names. Those are always fully opaque.
#
# Note that there is no buffer clear in between renders. So to avoid odd
# flickering, every key should be written to by at least one plugin.
# If that is an issue, simply start with the fill plugin, setting all keys
# to opaque black or some other color.
#
effects:
   #keyleds-default:
   #    plugins:
   #        - effect: wave
   #          period: 8000
   #          length: 2000
   #          direction: 240
   #          colors: [5f5fff, 5f5fff, 5f5fff, 5f5fff, 5f5fff, 0f0f0f]
    rainbow:
        plugins:
            - effect: wave
              period: 22222      # cycle duration in ms
              length: 1333      # wavelength (1000 is keyboard size)
              direction: 255    # 0 for upwards, 90 rightwards, 180 downwards, ...
              colors: [maroon, red, crimson, indianred, salmon, hotpink, palevioletred, deeppink, magenta, fuchsia,purple,mediumpurple,  orchid, plum,   pink, white, thistle, indigo, darkviolet, blueviolet, darkslateblue, navy, blue, dodgerblue, deepskyblue,cyan,turquoise,aquamarine, lightseagreen, mediumseagreen, springgreen,  green, limegreen, lime, olivedrab, lawngreen,greenyellow,yellowgreen, yellow, gold, goldenrod, coral,  orange,  tomato,  orangered, firebrick]
    darken:
        plugins:
            - effect: fill
              color: 00000099
    minecraft:
        groups:
            movement: [w,a,s,d, space]
            hotbar: ["1","2","3","4","5","6","7","8","9","0"]
            chat: [t, tab, enter]
            action: [lshift, e]
            discard: [delete]
        plugins:
            - effect: fill
              movement: chartreuse
            - effect: fill
              hotbar: lavender
            - effect: fill
              chat: slateblue
            - effect: fill
              action: yellow
            - effect: fill
              discard: ff000088
            - effect: breathe
              group: movement
              color: aaffaa77
              period: 4444
    console:
        groups:
            special: [enter, backspace, esc, tab, h,j,k,l]
            modifiers: [rctrl, lshift, rshift, lmeta, rmeta, lalt, ralt, capslock, fn, compose]
            ctrlc: [lctrl, c]
        plugins:
            - effect: fill
              color: 4a0766aa
            - effect: fill
              ctrlc: red
            - effect: breathe
              color: 6f0b7aec        # breathing keys will go from that color to transparent
              period: 7000          # breathe period in ms
            - effect: fill
              special: ee00ee55
            - effect: stars         # add some stars
              group: special
              number: 5            # how many stars are visible at once
              duration: 222        # how long a star remains visible (in ms)
              colors:
                - ffffffa9             # colors to use for the stars. They are picked
                - fdffcfa9           # randomly from that set. If not specified,
                - ffcff5a9
                - cff0ffa9
                - e8deffa9
                - ffbfcaa9
                - e6fff3a9
            - effect: fill
              functions: indigo
            - effect: stars
              group: functions
              number: 8
              duration: 600
              colors:
                - ffffff33             # colors to use for the stars. They are picked
                - fdffcf33           # randomly from that set. If not specified,
                - ffcff533
                - cff0ff33
                - e8deff33
                - ffbfca33
                - e6fff333
            - effect: breathe
              group: special
              color: ff77bb55
              period: 2567
            - effect: breathe
              group: NUMBERS
              color: bb448877
              period: 5555          # breathe period in ms
            - effect: breathe
              group: NUMBERS
              color: 2277aa77
              period: 15555          # breathe period in ms
            - effect: breathe
              group: NUMBERS
              color: cccccc77
              period: 8888          # breathe period in ms
            - effect: fill
              punctuation: 00ffff22
            - effect: breathe
              group: punctuation
              color: 3333ee77
            - effect: stars         # add some stars
              group: modifiers
              number: 4            # how many stars are visible at once
              duration: 255        # how long a star remains visible (in ms)
              colors:
                - ffffff44             # colors to use for the stars. They are pickea
                - 77ffcf44           # randomly from that set. If not specified,
                - ffcff544
                - 33f0ff44
                - e8deff44
                - 44bfca44
                - e6fff344
            - effect: breathe
              group: modifiers
              color: 5577fc77
              period: 1667
    nightsky:
        plugins:
            - effect: fill          # define a night sky background
              color: 481661
            - effect: stars         # add some stars
              number: 80            # how many stars are visible at once
              duration: 40000        # how long a star remains visible (in ms)
              colors:
                - white             # colors to use for the stars. They are picked
                - fdffcf            # randomly from that set. If not specified,
                - ffcff5
                - cff0ff
                - e8deff
                - ffbfca
                - e6fff3
    mod_keys:
        plugins:
            - effect: fill
              modifiers: black
            - effect: fill
              modifiers: ffffff66
            - effect: stars         # add some stars
              group: modifiers
              number: 6            # how many stars are visible at once
              duration: 333        # how long a star remains visible (in ms)
              colors:
                - ffffff44             # colors to use for the stars. They are pickea
                - 77ffcf44           # randomly from that set. If not specified,
                - ffcff544
                - 33f0ff44
                - e8deff44
                - 44bfca44
                - e6fff344
            - effect: breathe
              group: modifiers
              color: 5577fc77
              period: 1667
    border_rainbow:
        plugins:
            - effect: wave
              group: border
              period: 22222
              length: 1333
              direction: 255
              colors: [maroon, red, crimson, indianred, salmon, hotpink, palevioletred, deeppink, magenta, fuchsia,purple,mediumpurple,  orchid, plum,   pink, white, thistle, indigo, darkviolet, blueviolet, darkslateblue, navy, blue, dodgerblue, deepskyblue,cyan,turquoise,aquamarine, lightseagreen, mediumseagreen, springgreen,  green, limegreen, lime, olivedrab, lawngreen,greenyellow,yellowgreen, yellow, gold, goldenrod, coral,  orange,  tomato,  orangered, firebrick]
   #text-colors:
   #    groups:
   #        escape: [esc]           # it's possible to make effect-scope key groups
   #    plugins:
   #        - effect: fill
   #          color: 404060         # color is special: it's applied to all keys before
   #          escape: orange        # key groups are filled
   #          arrows: green
   #          functions: yellow
   #          modifiers: darkblue
    whack-a-mole:
        groups:
            game: [grave, 1, 2, 3, 4, 5, 6, 7, 8, 9, 0, minus, equal,
                   q, w, e, r, t, y, u, i, o, p, lbrace, rbrace,
                   a, s, d, f, g, h, j, k, l, semicolon, apostrophe, backslash,
                   z, x, c, v, b, n, m, comma, dot, slash,
                   lmeta, lalt, space, ralt, rmeta]
        plugins:
            - effect: fill
              color: black
            - effect: whack-a-mole
              group: game
    alert:
        groups:
            alert-keys: [esc, logo, game, light]
        plugins:
            - effect: breathe
              color: red
              period: 4000
              group: alert-keys
    standby:
        plugins:
            - effect: idle-dim
              color: 2b252efa      # color to dim into (example value is partially opaque black,
                                    #                    which results in a typical dimming effect)
              delay: 3             # idle time before dimming kicks in, in seconds
              fadein: 11111           # time for fading in on keypress, in milliseconds
              fadeout: 111111         # time for fading out after delay ran out, in milliseconds
            - effect: stars         # add some stars
              number: 16            # how many stars are visible at once
              duration: 7777        # how long a star remains visible (in ms)
              colors:
                - ffffff29             # colors to use for the stars. They are picked
                - fdffcf29           # randomly from that set. If not specified,
                - ffcff529
                - cff0ff29
                - e8deff29
                - ffbfca29
                - e6fff329
    feedback:
        plugins:
            - effect: reactive-hlines
              color: aaaafe99
              speed: 0.05         # inexplicably, smaller number = more speed
              fadetime: 0.05
            - effect: reactive-hlines
              color: fdfdfd88
              speed: 0.01         # inexplicably, smaller number = more speed
              fadetime: 0.07
            - effect: feedback      # turn keys on when pressed
              color: f542d1         # color when just pressed
              sustain: 555          # how long (in milliseconds) the color is held
              decay: 5555            # how long (in milliseconds) it then takes to fade out
    blackout:
        groups:
          no_key_cap: [F1]
          wonky: ["4"]
        plugins:
          # the 4 key gets the wrong color signal, but  this actually almost perfectly corrects it lol
          - effect: fill
            wonky: 4444ff71
          # the F1 keycap broke off and got lost somehow
          - effect: fill
            no_key_cap: black
            
        


# Profiles trigger effect activation when their lookup matches
# Their name doesn't matter, but order does, as when several profiles match
# the last matching wins.
#
# Only one profile can be active at any time. A profile with no lookup
# or default setting is always active. Lookups use regular expression. They
# must match fully (as if they were automatically enclosed in ^$).
#
profiles:
    __default__:                    # Special name __default__ is active when no other profile matches
        effects: [rainbow]     # Apply this effect
    __overlay__:
        # TEMP: disable idle-dim for porn shoot
        effects: [blackout, standby, feedback]
        #effects: [blackout, feedback]
    empty:
        lookup: { class: ^$ }       # Empty class: when no window is active or screen is locked
        effects: [rainbow, border_rainbow]
    video:
        lookup: { class: vlc }
        effects: [nightsky]
    konsole:
        lookup: { class: Alacritty|XTerm }
        effects: [mod_keys, console, border_rainbow]
    chromium:                       # Okay that profile is ugly, it's just for demo
        lookup: { class: Google-chrome|Chromium }
        effects: [nightsky]
    ardour:
        lookup: { class: Ardour }
        effects: [rainbow, mod_keys]
    mc: 
        lookup: { class: Minecraft.* }
        effects: [rainbow, darken, minecraft]
    whack-a-mole:
        lookup: { title: ".*\\bmole\\b.*" }
        effects: [whack-a-mole, border_rainbow]
